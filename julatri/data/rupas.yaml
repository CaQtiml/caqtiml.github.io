# รูป ๒๘ — รูปสมุทเทสนัย (หมวดที่ ๑ ของปริจเฉทที่ ๖)
# Source: mainbookjultri/03-ปริจเฉทที่6-รูปปรมัตถ์.md, lines 1-539.
# Only นัยที่ ๑ (รูปสมุทเทสนัย) is modeled here — see CONTEXT.md for why the other
# 4 นัย (วิภาค/สมุฏฐาน/กลาป/ปวัตติกม) are separate, not-yet-designed slices.
#
# 11 groups, in source order (lines 20-34, 102-126); group id -> (thai, count, bucket):
#   mahabhuta   มหาภูตรูป    4  นิปผันน
#   pasada      ปสาทรูป      5  นิปผันน
#   visaya      วิสยรูป      4  นิปผันน   (source notes "๗ หรือ ๔" -- โผฏฐัพพารมณ์ 3
#                                          is the same substance as 3 of the มหาภูตรูป,
#                                          not modeled as separate entries here)
#   bhava       ภาวรูป       2  นิปผันน
#   hadaya      หทยรูป       1  นิปผันน
#   jivita      ชีวิตรูป     1  นิปผันน
#   ahara       อาหารรูป     1  นิปผันน
#   pariccheda  ปริจเฉทรูป   1  อนิปผันน (= อากาสธาตุ)
#   vinnatti    วิญญัติรูป   2  อนิปผันน
#   vikara      วิการรูป     3  อนิปผันน (source notes "๕ หรือ ๓" -- กายวิญญัติ/
#                                          วจีวิญญัติ counted again under วิการรูป
#                                          in one alt reading; not double-entered here)
#   lakkhana    ลักขณรูป     4  อนิปผันน
#
# `kicha` (กิจ) is present ONLY on the 5 ปสาทรูป entries -- the source states a
# กิจ explicitly only for those (line 300, 308, 316, 326, 334); absent elsewhere,
# matching the "field present only when applicable" convention already used by
# `footnotes` on cetasikas.

rupas:
  # --- มหาภูตรูป ๔ (lines 164, 172-175, 208, 240-294) ---
  - id: pathavi
    thai: ปถวี
    group: mahabhuta
    order: 1
    ongkhatham: รูปแข็ง และอ่อน
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "สหชาตรูปานิ ปตนฺติ ปติฏฺฐหนฺติ เอตฺถาติ = ปถวี — ธรรมชาติที่เป็นที่ตั้งที่อาศัยของสหชาตรูปทั้งหลาย"
    description: >-
      ธาตุดิน มีลักษณะแข็งเมื่อเทียบกับมหาภูตรูปอื่น หรือปรากฏเป็นอ่อนเมื่อมีน้อย
      เป็นที่อาศัย/ที่ตั้งของรูปอื่นๆ ทั้งหมด หากปราศจากปถวีธาตุ รูปารมณ์ สัททารมณ์
      คันธารมณ์ รสารมณ์ และโผฏฐัพพารมณ์ (เตโช/วาโย) ก็ปรากฏไม่ได้เลย

  - id: apo
    thai: อาโป
    group: mahabhuta
    order: 2
    ongkhatham: รูปที่ไหล หรือเกาะกุม
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "อาเปติ สหชาตรูเปสุ พฺยาเปตฺวา ติฏฺฐตีติ = อาโป — ธรรมชาติที่แผ่ซึมซาบและตั้งอยู่ในรูปที่เกิดร่วมกัน"
    description: >-
      ธาตุน้ำ รู้ได้ด้วยใจเท่านั้น ไม่ใช่ด้วยตาหรือกายสัมผัส มีลักษณะไหลเมื่อมีมาก
      หรือเกาะกุมเป็นก้อนเมื่อมีน้อย เปรียบเหมือนยางเหนียวเชื่อมปรมาณูปถวีให้เป็น
      รูปร่างสัณฐาน มี ๒ อย่าง: อาพันธลักขณะ (เกาะกุมปกติ ไหลเมื่อถูกความร้อน เช่น
      เหล็ก/ทอง/ขี้ผึ้ง) และปัคฆรณลักขณะ (ไหลปกติ เกาะกุมเมื่อถูกความเย็น เช่น น้ำ)

  - id: tejo
    thai: เตโช
    group: mahabhuta
    order: 3
    ongkhatham: รูปที่เย็น ร้อน
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "เตเชติ ปริปาเจตีติ = เตโช — ธรรมชาติที่ทำให้สุก"
    description: >-
      ธาตุไฟ มีทั้งลักษณะร้อน (อุณหเตโช) และเย็น (สีตเตโช) สภาวะเป็นไอเป็นลักษณะ
      ทำหน้าที่ให้สุกและละเอียดนุ่มนวล มี ๕ อย่าง: อุสุมาเตโช (ไออุ่นประจำกาย),
      สันตัปปนเตโช (ร้อนมาก), ทหนเตโช (ร้อนจัดจนเผาผลาญ), ชิรณเตโช (ทำให้ร่างกาย
      ทรุดโทรมแก่ลง), ปาจกเตโช (ย่อยอาหาร) — ๓ อย่างหลังเป็นอาการวิปริตของ
      อุสุมาเตโช ไม่ได้มีอยู่ประจำ

  - id: vayo
    thai: วาโย
    group: mahabhuta
    order: 4
    ongkhatham: รูปที่หย่อน ตึง
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "วายติ สหชาตธมฺเม อุปตฺถมฺเภติ กตฺวา วหตีติ = วาโย — ธาตุที่ทำให้รูปที่เกิดร่วมกันตั้งมั่นไม่เคลื่อนคลอน"
    description: >-
      ธาตุลม มีลักษณะเคร่งตึง (วิตถัมภนวาโย — ทำให้ตั้งมั่นไม่คลอนแคลน) หรือ
      เคลื่อนไหว (สมีรณวาโย — ทำให้เคลื่อนไหวไปมา) มี ๖ อย่าง: อุทธังคมวาโย (พัดขึ้น),
      อโธคมวาโย (พัดลง), กุจฉิฏฐวาโย (ในช่องท้อง), โกฏฐาสยวาโย (ในลำไส้ใหญ่),
      องคมังคานุสารีวาโย (ทั่วร่างกาย), อัสสาสปัสสาสวาโย (ลมหายใจเข้าออก) —
      ภายในกายเรียกอัชฌัตตวาโย ภายนอกเรียกพหิทธวาโย

  # --- ปสาทรูป ๕ (lines 175-180, 209-213, 296-336) ---
  - id: cakkhu-pasada
    thai: จักขุปสาท
    group: pasada
    order: 1
    ongkhatham: ความใสที่สามารถรับรูปารมณ์ได้
    thiKoet: เกิดอยู่ในลูกตา
    etymology: "จกฺขุวิญฺญาณาธิฏฺฐิตํ...= จกฺขุ — เป็นที่ตั้งแห่งจักขุวิญญาณ และมีสภาพคล้ายบอกให้จักขุวิญญาณรู้อารมณ์"
    description: >-
      รูปที่เกิดจากกรรม มีความใสดุจกระจกเงา รับรูปารมณ์ได้ ตั้งอยู่ระหว่างกลาง
      ตาดำ มีเยื่อตา ๗ ชั้นซับอยู่ โตประมาณเท่าหัวเหา
    kicha: "ให้สำเร็จกิจ ๒ อย่าง: เป็นวัตถุอันเป็นที่ตั้งแห่งจักขุวิญญาณจิต และเป็นทวารอันเป็นที่เกิดแห่งจักขุทวารวิถีจิต"

  - id: sota-pasada
    thai: โสตปสาท
    group: pasada
    order: 2
    ongkhatham: ความใสที่สามารถรับสัททารมณ์ได้
    thiKoet: เกิดอยู่ในรูหู
    etymology: "โสตวิญฺญาณธิฏฺฐิตํ หุตฺวา สทฺทํ สุณาตีติ = โสตํ — เป็นที่ตั้งแห่งโสตวิญญาณและได้ยินเสียง"
    description: >-
      รูปที่เกิดจากกรรม มีความใสบริสุทธิ์ รับเสียงต่างๆ ตั้งอยู่ในช่องหูรูป
      วงแหวน เป็นที่งอกแห่งขนแดงเส้นละเอียด
    kicha: "ให้สำเร็จกิจ ๒ อย่าง: เป็นวัตถุอันเป็นที่ตั้งแห่งโสตวิญญาณจิต และเป็นทวารอันเป็นที่เกิดแห่งโสตทวารวิถีจิต"

  - id: ghana-pasada
    thai: ฆานปสาท
    group: pasada
    order: 3
    ongkhatham: ความใสที่สามารถรับคันธารมณ์ได้
    thiKoet: เกิดอยู่ในรูจมูก
    etymology: "ฆายตีติ = ฆานํ — สูดดมกลิ่น (แสดงโดยฐานยูปจารนัย คือนัยโดยอ้อม)"
    description: >-
      รูปที่เกิดจากกรรม มีความใสบริสุทธิ์ รับกลิ่นต่างๆ ตั้งอยู่ภายในช่องจมูก
      ที่มีสัณฐานดังกีบแพะ
    kicha: "ให้สำเร็จกิจ ๒ อย่าง: เป็นวัตถุอันเป็นที่ตั้งแห่งฆานวิญญาณจิต และเป็นทวารอันเป็นที่เกิดแห่งฆานทวารวิถีจิต"

  - id: jivha-pasada
    thai: ชิวหาปสาท
    group: pasada
    order: 4
    ongkhatham: ความใสที่สามารถรับรสารมณ์ได้
    thiKoet: เกิดอยู่ที่ลิ้น
    etymology: "ชีวิตํ อวฺหายตีติ = ชิวฺหา — มีสภาพคล้ายกับเรียกซึ่งรสที่เป็นเหตุให้อายุยืน"
    description: >-
      รูปที่เกิดจากกรรม มีความใสบริสุทธิ์ รับรสต่างๆ ตั้งอยู่ในท่ามกลางลิ้น
      ที่มีสัณฐานเหมือนปลายกลีบดอกอุบล
    kicha: "ให้สำเร็จกิจ ๒ อย่าง: เป็นวัตถุอันเป็นที่ตั้งแห่งชิวหาวิญญาณ และเป็นทวารอันเป็นที่เกิดแห่งชิวหาทวารวิถีจิต"

  - id: kaya-pasada
    thai: กายปสาท
    group: pasada
    order: 5
    ongkhatham: ความใสที่สามารถรับโผฏฐัพพารมณ์ได้
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "กุจฺฉิตานํ เกสาทีนํ...อาโยติ = กาโย — ที่ประชุมแห่งส่วนต่างๆ ที่น่าเกลียดและอกุศลธรรม"
    description: >-
      รูปที่เกิดจากกรรม มีความใสบริสุทธิ์ รับสัมผัส เย็น ร้อน อ่อน แข็ง หย่อน
      ตึง เกิดทั่วร่างกาย ยกเว้นปลายผม ขน เล็บ หนังที่หนา และบริเวณอาหารใหม่
      ใต้ไส้ใหญ่อันเป็นที่ตั้งของปาจกเตโช
    kicha: "ให้สำเร็จกิจ ๒ อย่าง: เป็นวัตถุอันเป็นที่ตั้งแห่งกายวิญญาณ และเป็นทวารอันเป็นที่เกิดแห่งกายทวารวิถีจิต"

  # --- วิสยรูป ๔ (canonical count; source notes "๗ หรือ ๔" -- โผฏฐัพพารมณ์
  #     redundancy, see group note above) (lines 181-185, 214-219, 338-380) ---
  - id: rupa-rammana
    thai: รูปารมณ์
    group: visaya
    order: 1
    ongkhatham: สีต่างๆ
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "รูปยติ หทยงฺคตภาวํ ปกาเสตีติ = รูปํ — แสดงความรู้สึกของจิตใจ หรือแสดงวัตถุสิ่งของให้ปรากฏ"
    description: >-
      สีต่างๆ ที่ทำให้รูปร่างสัณฐานและความรู้สึกของสิ่งมีชีวิต/ไม่มีชีวิต
      ปรากฏให้ผู้อื่นรู้ได้

  - id: sadda-rammana
    thai: สัททารมณ์
    group: visaya
    order: 2
    ongkhatham: เสียงต่างๆ
    thiKoet: เกิดได้ในร่างกายทั่วไป
    etymology: "สทฺทยติ อุจฺจารยตีติ = สทฺโท — เปล่งออกมาได้ (หรือ) สปฺปติ โสตวิญฺเญยฺยภาวํ คจฺฉตีติ = สทฺโท — ถึงสภาพที่โสตวิญญาณรู้ได้"
    description: >-
      เสียงต่างๆ ทั้งที่สัตว์เปล่งออกมาและเสียงของสิ่งไม่มีชีวิต เป็นอารมณ์
      ของโสตวิญญาณ

  - id: gandha-rammana
    thai: คันธารมณ์
    group: visaya
    order: 3
    ongkhatham: กลิ่นต่างๆ
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "คนฺธยติ อตฺตโน วตฺถุํ สูเจตีติ = คนฺโธ — แสดงให้ที่อาศัยของตนปรากฏ"
    description: >-
      กลิ่นต่างๆ ที่แสดงให้รู้ถึงวัตถุที่ตนอาศัยอยู่ เมื่อแผ่ตัวออกมาย่อมทำให้
      รู้ทันทีว่าเป็นกลิ่นอะไรและมาจากที่ใด

  - id: rasa-rammana
    thai: รสารมณ์
    group: visaya
    order: 4
    ongkhatham: รสต่างๆ
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "รสิยติ อสฺสาทิยตีติ = รโส — เป็นที่พอใจ (คือที่รู้) ของชิวหาวิญญาณ"
    description: >-
      รสต่างๆ ไม่ว่าดีหรือไม่ดี ล้วนเป็นอารมณ์ที่ชิวหาวิญญาณย่อมรู้/ลิ้มรสได้
      ทั้งสิ้น

  # --- ภาวรูป ๒ (lines 186-187, 222-223, 382-395) ---
  - id: itthi-bhava
    thai: อิตถีภาวะ
    group: bhava
    order: 1
    ongkhatham: รูปที่เป็นเหตุแห่งความเป็นหญิง
    thiKoet: เกิดอยู่ในร่างกายทั่วไปของเพศหญิง
    etymology: "อิตฺถิยา ภาโว = อิตฺถิภาโว — เหตุแห่งความเป็นหญิง"
    description: >-
      รูปที่ปกครองลิงค์ (รูปร่างสัณฐาน), นิมิต (เครื่องหมาย เช่น หนวดเครา),
      กุต (นิสัย), และอากัปปะ (กิริยาอาการ) ให้เป็นไปในทางหญิง

  - id: purisa-bhava
    thai: ปุริสภาวะ
    group: bhava
    order: 2
    ongkhatham: รูปที่เป็นเหตุแห่งความเป็นชาย
    thiKoet: เกิดอยู่ในร่างกายทั่วไปของเพศชาย
    etymology: "ปุมสฺส ภาโว = ปุมฺภาโว — เหตุแห่งความเป็นชาย"
    description: >-
      รูปที่ปกครองลิงค์ นิมิต กุต และอากัปปะ ให้เป็นไปในทางชาย

  # --- หทยรูป ๑ (lines 188, 224, 397-410) ---
  - id: hadaya-vatthu
    thai: หทยวัตถุ
    group: hadaya
    order: 1
    ongkhatham: รูปที่เกิดอยู่ในหัวใจ และเป็นที่อาศัยเกิดของจิตเจตสิกทั้งหลาย
    thiKoet: เกิดอยู่ที่รูปหัวใจ
    etymology: "หทนฺติ สตฺตา...เอเตนาติ = หทยํ — เหตุให้สัตว์ทำสิ่งที่เป็นประโยชน์และไม่เป็นประโยชน์"
    description: >-
      กัมมชรูปชนิดหนึ่งที่เกิดอยู่ภายในมังสหทยรูป (หัวใจเนื้อ) ตั้งอยู่ในช่อง
      รูปคล้ายบ่อ โตประมาณเท่าเมล็ดดอกบุนนาค ภายในมีโลหิตหล่อเลี้ยงอยู่ประมาณ
      ๑ ซองมือ เป็นที่อาศัยเกิดของมโนธาตุและมโนวิญญาณธาตุ — ในปัญจโวการภูมิ
      ถ้าไม่มีหทยวัตถุรูปแล้ว ย่อมทำการงานหรือนึกคิดรู้เรื่องราวต่างๆ ไม่ได้เลย

  # --- ชีวิตรูป ๑ (lines 189, 225, 412-419) ---
  - id: jivitindriya
    thai: ชีวิตินทรีย์
    group: jivita
    order: 1
    ongkhatham: รูปที่รักษากัมมชรูปทั้งหลาย
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "ชีวนฺติ สหชาตธมฺมา เอเตนาติ = ชีวิตํ — เหตุให้สหชาตรูปทั้งหลายเป็นอยู่ได้"
    description: >-
      ทำให้กัมมชรูปเกิดขึ้นติดต่อกันและตั้งอยู่ได้ (กรรมเองไม่อาจรักษา เพราะ
      เป็นอดีตล่วงไปแล้ว) ส่วนจิตตชรูป/อุตุชรูป/อาหารชรูปไม่ต้องมีรูปเฉพาะ
      รักษา เพราะมีสมุฏฐานของตนเองรักษาอยู่แล้ว

  # --- อาหารรูป ๑ (lines 190, 226, 420-432) ---
  - id: kabalinkara-ahara
    thai: กพฬีการาหาร
    group: ahara
    order: 1
    ongkhatham: รูปที่นำให้อาหารชรูปเกิด
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "กพฬีกาโร จ โส อาหาโร จาติ = กพฬีการาหาโร — โภชนะที่กระทำให้เป็นคำและกลืนกินได้"
    description: >-
      ได้แก่โอชาที่อยู่ในอาหารต่างๆ เมื่อเข้าสู่ร่างกายแล้วทำให้อาหารชรูปเกิด
      ขึ้นทันที ทำให้ร่างกายมีกำลังและเติบโต หรือทำให้ร่างกายสมบูรณ์คงอยู่ได้
      เมื่อเจริญเติบโตสุดขีดแล้ว

  # --- ปริจเฉทรูป ๑ = อากาสธาตุ (lines 191, 227, 434-450) ---
  - id: akasadhatu
    thai: อากาสธาตุ
    group: pariccheda
    order: 1
    ongkhatham: อากาสรูปที่คั่นระหว่างรูปกลาปต่อรูปกลาป
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "น กสฺสติ อกาโส, อกาโสเยว อากาโส — ที่ที่ขีดเขียนไม่ได้ ชื่อว่าอากาศ"
    description: >-
      อากาศมี ๔ อย่าง: อัชฏากาศ (ว่างเปล่านอกร่างกาย), ปริจฉินนากาศ (ช่องมี
      ขอบเขต เช่น ช่องหู จมูก ปาก), กสิณุคฆาฏิมากาศ (เพิกจากกสิณ ๙),
      ปริจเฉทากาศ (คั่นระหว่างรูปกลาปต่อรูปกลาป คือปริจเฉทรูปนี้เอง) — หากไม่มี
      ปริจเฉทรูป จำนวนรูปกลาป ที่สุด และเขตแดนของรูปจะมีไม่ได้เลย

  # --- วิญญัติรูป ๒ (lines 192-193, 231-232, 452-471) ---
  - id: kaya-vinnatti
    thai: กายวิญญัติ
    group: vinnatti
    order: 1
    ongkhatham: การเคลื่อนไหวต่างๆ ของร่างกาย
    thiKoet: เกิดได้ในร่างกายทั่วไป
    etymology: "กาเยน วิญฺญตฺติ = กายวิญฺญตฺติ — อาการพิเศษที่ทำให้รู้ความประสงค์ได้ด้วยการเคลื่อนไหว"
    description: >-
      อาการพิเศษที่เกิดร่วมกับการเคลื่อนไหวร่างกาย ทำให้ผู้อื่นรู้ความประสงค์
      แบ่งเป็นโพธนกายวิญญัติ (มุ่งให้ผู้อื่นรู้) และปวัตตนกายวิญญัติ (เคลื่อนไหว
      ตามปกติ ไม่มุ่งให้ผู้อื่นรู้)

  - id: vaci-vinnatti
    thai: วจีวิญญัติ
    group: vinnatti
    order: 2
    ongkhatham: การเคลื่อนไหวต่างๆ ของวาจา
    thiKoet: เกิดได้ที่ปาก
    etymology: "วจิยา วิญฺญตฺติ = วจีวิญฺญตฺติ — อาการพิเศษที่ทำให้รู้ความประสงค์ได้ด้วยการพูด"
    description: >-
      อาการพิเศษที่เกิดร่วมกับการพูด ทำให้ผู้อื่นรู้ความประสงค์ แบ่งเป็น
      โพธนวจีวิญญัติและปวัตตนวจีวิญญัติ เช่นเดียวกับกายวิญญัติ

  # --- วิการรูป ๓ (lines 194-196, 233, 473-486) ---
  - id: lahuta
    thai: ลหุตา
    group: vikara
    order: 1
    ongkhatham: ความเบาของนิปผันนรูป
    thiKoet: เกิดได้ในร่างกายทั่วไป
    etymology: "ลหุโน ภาโว = ลหุตา — อาการที่เบา"
    description: >-
      อาการพิเศษของนิปผันนรูปที่เกิดเฉพาะในสิ่งมีชีวิต เกิดขึ้นพร้อมกับมุทุตา
      และกัมมัญญตาเสมอ ทำให้กิริยาอาการ การเคลื่อนไหว และการพูดเป็นไปโดย
      สะดวกสบาย ไม่ขัดข้อง

  - id: muduta
    thai: มุทุตา
    group: vikara
    order: 2
    ongkhatham: ความอ่อนของนิปผันนรูป
    thiKoet: เกิดได้ในร่างกายทั่วไป
    etymology: "มุทุโน ภาโว = มุทุตา — อาการที่อ่อน"
    description: >-
      อาการพิเศษของนิปผันนรูป เกิดขึ้นพร้อมกับลหุตาและกัมมัญญตาเสมอ

  - id: kammannata
    thai: กัมมัญญตา
    group: vikara
    order: 3
    ongkhatham: ความควรแก่การงานของนิปผันนรูป
    thiKoet: เกิดได้ในร่างกายทั่วไป
    etymology: "กมฺมญฺญสฺส ภาโว = กมฺมญฺญตา — สภาพที่เป็นความดีในการงานต่างๆ"
    description: >-
      อาการพิเศษของนิปผันนรูป เกิดขึ้นพร้อมกับลหุตาและมุทุตาเสมอ (ในอีกนัยหนึ่ง
      วิญญัติรูป ๒ ก็นับเข้าในวิการรูปด้วย ทำให้วิการรูปนับได้ ๕ หรือ ๓)

  # --- ลักขณรูป ๔ (lines 197-200, 234, 487-539) ---
  - id: upacaya
    thai: อุปจยะ
    group: lakkhana
    order: 1
    ongkhatham: ความเกิดขึ้นครั้งแรกและเกิดขึ้นครั้งหลังๆ จนครบรูปที่ควรเกิดขึ้นได้ของนิปผันนรูป
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "อาทิโต อุปริโต จ จโยติ = อุปจโย"
    description: >-
      การเกิดขึ้นครั้งแรกของกัมมชรูป (ปฏิสนธิขณะ) และการเกิดขึ้นครั้งหลังๆ
      จนครบบริบูรณ์ — สำหรับคัพภเสยยกสัตว์ครบบริบูรณ์ที่สัปดาห์ที่ ๑๑ ส่วน
      สังเสทชะ/โอปปาติกะครบตั้งแต่ปฏิสนธิขณะเลย

  - id: santati
    thai: สันตติ
    group: lakkhana
    order: 2
    ongkhatham: ความเกิดขึ้นสืบต่อกันของนิปผันนรูปจนถึงตาย
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "สมฺพนฺธา ตติ = สนฺตติ"
    description: >-
      ความเกิดขึ้นติดต่อกันของกัมมชรูป (และจิตตชรูป/อุตุชรูป/อาหารชรูป) หลัง
      เกิดครบบริบูรณ์แล้ว ไปจนตลอดชีวิต — อุปมาเหมือนบ่อน้ำใกล้แม่น้ำ: อุปจยะ
      คือน้ำที่ไหลเข้าจนเต็มบ่อ สันตติคือน้ำที่ไหลล้นออกไปเรื่อยๆ

  - id: jarata
    thai: ชรตา
    group: lakkhana
    order: 3
    ongkhatham: ความแก่ของนิปผันนรูป
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "ชรานํ ภาโว = ชรตา"
    description: >-
      ขณะตั้งอยู่ของรูป (ขณะที่ ๒ ถึง ๕๐ จากทั้งหมด ๕๑ ขณะเล็กที่เป็นอายุของ
      รูป) มีอยู่ตั้งแต่ปฏิสนธิขณะจนกระทั่งสัตว์นั้นตาย

  - id: aniccata
    thai: อนิจจตา
    group: lakkhana
    order: 4
    ongkhatham: ความดับของนิปผันนรูป
    thiKoet: เกิดอยู่ในร่างกายทั่วไป
    etymology: "อนิจฺจานํ ภาโว = อนิจฺจตา"
    description: >-
      ขณะดับของรูป คือขณะที่ ๕๑ อันเป็นขณะสุดท้ายของอายุรูป
