# จิต (Citta) reference data
# Pilot slice: the 12 อกุศลจิต only (โลภมูลจิต 8, โทสมูลจิต 2, โมหมูลจิต 2).
# Each citta's `cetasikas` list is the สังคหนัย (citta -> cetasika) data,
# verified page-by-page against the official textbook (pp. 50-51).
# `count` is redundant with len(cetasikas) - the build script checks they agree,
# so a typo here (or in the list) gets caught instead of silently shipped.
#
# สัมปโยคนัย (cetasika -> citta) and ตทุภยมิสสกนัย (cetasika -> cetasika) are NOT
# stored here - they're computed by scripts/build_data.py from this same data.

