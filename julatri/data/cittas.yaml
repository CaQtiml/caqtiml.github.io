# จิต (Citta) reference data -- all 89 cittas.
# Each citta's `cetasikas` list is the สังคหนัย (citta -> cetasika) data.
# สัมปโยคนัย and ตทุภยมิสสกนัย are computed by scripts/build_data.py from this.
# Verified against the official จูฬตรี textbook (per-citta tables pp.50-56
# + cross-checked against the summary diagram p.56) during data entry.
#
# Uses the 121-citta (พิสดาร) system for โลกุตตรจิต -- 40 cittas (8 magga/phala
# stages x 5 jhana levels each), not the abbreviated 8-citta (ย่อ) form.
#
# Array order within each group matches how this project renders rows in the UI
# (see CITTA_GROUPS in js/app.js) -- reordering entries changes the row layout.

