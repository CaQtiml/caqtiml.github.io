gatha: 'ปฏิสนฺธาทโย นาม กิจฺจเภเทน จุทฺทส / ทสธา ฐานเภเทน จิตฺตุปฺปาทา ปกาสิตา

  อฏฺฐสฏฺฐิ ตถา เทฺว จ นวาฏฺฐ เทฺว ยถากฺกมํ / เอก ทฺวิ ติ จตุ ปญฺจ กิจฺจฏฺฐานานิ นิทฺทิเส'
