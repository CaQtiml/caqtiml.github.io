    note: 'members ที่แจกแจงไว้นี้คือ "สังโยชน์ ๑๐ ตามนัยพระสูตร" (L181-L201) ซึ่งเป็นรายการ มาตรฐานที่รู้จักทั่วไป. องค์ธรรมปรมัตถ์ที่ต่างกันในนัยนี้มี ๗ (โลภะ โทสะ มานะ ทิฏฐิ วิจิกิจฉา อุทธัจจะ โมหะ). — ตำรายังให้ "สังโยชน์ ๑๐ ตามนัยพระอภิธรรม" (L203-L223): ๑.กามราค ๒.ภวราค ๓.ปฏิฆะ ๔.มานะ ๕.ทิฏฐิ ๖.สีลัพพตปรามาส ๗.วิจิกิจฉา ๘.อิสสา ๙.มัจฉริยะ ๑๐.อวิชชา — เพิ่ม อิสสา/มัจฉริยะ, ตัด รูปราค/อรูปราค/อุทธัจจะ; องค์ธรรม ต่างกันจริง ๘ (โลภะ โทสะ มานะ ทิฏฐิ วิจิกิจฉา อิสสา มัจฉริยะ โมหะ). — คาถาว่า ''นว สัญโญชนา มตา'' = องค์ธรรมปรมัตถ์ ๙ (นับตามอภิธรรมนัย โดยหักโลภะที่ซ้ำ กามราค+ภวราค ออก ๑ จาก ๑๐ และนับทิฏฐิสังโยชน์กับสีลัพพตปรามาสสังโยชน์แยกเป็น ๒); ไม่ตรงกับจำนวนปรมัตถ์ที่ต่างกันจริงของทั้งสองนัยในตำราเล่มนี้ — ผู้ใช้ควรตรวจ. โอรัมภาคิยะ/อุทธัมภาคิยะ: นัยพระสูตร ๕ + ๕ (L419-L433); นัยพระอภิธรรม ๗ + ๓ (L445-L459); ปรมัตถทีปนีมหาฎีกา — โอรัมภาคิยะ = ที่ประหาณด้วยมรรคเบื้องต่ำ ๓, อุทธัมภาคิยะ = ที่ประหาณด้วยอรหัตตมรรค (L441). breakdown เหล่านี้ไม่ทำเป็นโครงสร้าง.'
