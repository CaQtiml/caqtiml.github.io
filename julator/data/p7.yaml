- id: sabba
  thai: สัพพสังคหะ
  note: 'สังเคราะห์วัตถุธรรม ๗๒ (จิต ๑ + เจตสิก ๕๒ + นิปผันนรูป ๑๘ + นิพพาน ๑) เข้าเป็น ๕ หมวด: ขันธ์ อุปาทานักขันธ์ อายตนะ ธาตุ อริยสัจจะ. ต้นฉบับ L1339 ระบุ "ว่าโดยประเภทมี ๓๖ (ไม่ต้องนับอุปาทานักขันธ์โดยเฉพาะ)" — ผลรวม ขันธ์ ๕ + อายตนะ ๑๒ + ธาตุ ๑๘ + สัจจะ ๔ = ๓๙ ไม่ตรงกับ ๓๖ ที่พิมพ์ไว้ (ดู NOTES). ในฐานข้อมูลนี้ id ปรมัตถ์เป็นระบบจิต ๑๒๑ ทุก "จิตทั้งหมด" จึงแจง ๑๒๑ ดวง. หมายเหตุ id: "jivitindriya" ถูกใช้ร่วมกันทั้งชีวิตินทรีย์เจตสิกและชีวิตรูป (paramattha.yaml) ในหมวดที่รวมทั้งเจตสิกและรูป (ธัมมายตนะ ธัมมธาตุ ทุกขสัจจะ) จึงปรากฏ id นี้ครั้งเดียว — จำนวนองค์ธรรมตามหลัก (๖๙ / ๑๖๐) จึงมากกว่าจำนวน id ที่ไม่ซ้ำ (๖๘ / ๑๕๙) อยู่ ๑.'
  sets:
  - id: khandha
    thai: ขันธ์
    count_label: ๕
    gatha: รูปญฺจ เวทนา สญฺญา  เสสเจตสิกา ตถา / วิญฺญาณมิติ ปญฺเจเต  ปญฺจกฺขนฺธา ภาสิตา ฯ
    source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L1341-L1353, คาถา L1449-L1462
