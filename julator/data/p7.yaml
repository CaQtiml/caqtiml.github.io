- id: bodhipakkhiya
  thai: โพธิปักขิยสังคหะ
  gatha: ฉนฺโท จิตฺตมุเปกฺขา จ สทฺธาปสฺสทฺธิปีติโย / สมฺมาทิฏฺฐิ จ สงฺกปฺโป วายาโม วิรติตฺตยํ / สมฺมาสติ สมาธีติ จุทฺทเสเต สภาวโต / สตุตฺตึสปฺปเภเทน สตฺตธา ตตฺถ สงฺคโห ฯ
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L881-L1327
  note: 'โพธิปักขิยธรรม = ธรรมฝ่ายมรรคญาณ ๔ (L1067-L1085). มี ๗ หมวด รวม ๓๗ ประการ แต่เมื่อว่าโดยองค์ธรรมปรมัตถ์มีเพียง ๑๔ (คาถา L1001-L1011): ฉันทะ, จิต, ตัตรมัชฌัตตตา, สัทธา, ปัสสัทธิ (กายปัสสัทธิ+จิตตปัสสัทธิ นับเป็น ๑), ปีติ, ปัญญา, วิตก, วีริยะ, วิรตีเจตสิก ๓ (สัมมาวาจา สัมมากัมมันตะ สัมมาอาชีวะ), สติ, เอกัคคตา. การจำแนก ๑๔ องค์ธรรมโดยฐาน (คาถา + คำอธิบาย L1013-L1058): ๙ องค์ธรรมมีฐานละ ๑ = วิตก(สัมมาสังกัปปะ), ปัสสัทธิ(ปัสสัทธิสัมโพชฌงค์), ปีติ(ปีติสัมโพชฌงค์), ตัตรมัชฌัตตตา(อุเบกขาสัมโพชฌงค์), ฉันทะ(ฉันทิทธิบาท), จิต(จิตติทธิบาท), สัมมาวาจา, สัมมากัมมันตะ, สัมมาอาชีวะ; วีริยะมี ๙ ฐาน (สัมมัปปธาน ๔ + วิริยิทธิบาท + วิริยินทรีย์ + วิริยพละ + วิริยสัมโพชฌงค์ + สัมมาวายามะ); สติมี ๘ ฐาน (สติปัฏฐาน ๔ + สตินทรีย์ + สติพละ + สติสัมโพชฌงค์ + สัมมาสติ); เอกัคคตามี ๔ ฐาน (สมาธินทรีย์ + สมาธิพละ + สมาธิสัมโพชฌงค์ + สัมมาสมาธิ); ปัญญามี ๕ ฐาน (วีมังสิทธิบาท + ปัญญินทรีย์ + ปัญญาพละ + ธัมมวิจยสัมโพชฌงค์ + สัมมาทิฏฐิ); สัทธามี ๒ ฐาน (สัทธินทรีย์ + สัทธาพละ). รวม ๙+๙+๘+๔+๕+๒ = ๓๗. ที่เกิดของโพธิปักขิยธรรม
    ๓๗ (คาถา L1060-L1066): ทั้ง ๓๗ เกิดในโลกุตตรจิต (เว้น สัมมาสังกัปปะ ไม่เกิดในโลกุตตรทุติยฌานขึ้นไป, ปีติสัมโพชฌงค์ ไม่เกิดใน โลกุตตรจตุตถฌาน/ปัญจมฌาน) และเกิดในโลกียกุศล/กิริยาได้เมื่อสำเร็จวิสุทธิ ๖ (เว้นญาณทัสสนวิสุทธิ). -- deferred, not built as structure. การจำแนกองค์มรรค ๘ โดยขันธ์ (L1319-L1326): สีลขันธ์ = สัมมาวาจา/สัมมากัมมันตะ/ สัมมาอาชีวะ; สมาธิขันธ์ = สัมมาวายามะ/สัมมาสติ/สัมมาสมาธิ; ปัญญาขันธ์ = สัมมาทิฏฐิ/สัมมาสังกัปปะ. -- deferred, not built as structure.'
  sets:
