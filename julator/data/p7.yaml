    thai: สัมมัปปธาน
    count_label: ๔
    source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L903-L921, L1131-L1194
    note: องค์ธรรมของทั้ง ๔ คือ วีริยเจตสิก ดวงเดียว -- วิริยะดวงเดียวเป็นสัมมัปปธาน ทั้ง ๔ ได้เพราะกิจของวิริยะมี ๔ อย่าง (L1141-L1148). ต้องเป็นวิริยะอย่าง แรงกล้าในกุศลชวนะเท่านั้น (วิริยะในกิริยาชวนะ/ผลจิต ไม่เป็นสัมมัปปธาน -- L1137-L1139); host จิต = กุศลจิต ๒๑.
