  gatha: ฉ เหตู ปญฺจ ฌานงฺคา มคฺคงฺคา นว วตฺถุโต / โสฬสินฺทฺริยธมฺมา จ พลธมฺมา นเวริตา ฯ / จตฺตาโรธิปตี วุตฺตา ตถาหาราติ สตฺตธา / กุสลาทิสมากิณฺโณ วุตฺโต มิสฺสกสงฺคโห ฯ
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L483-L877
  note: รวม ๗ หมวดที่สงเคราะห์ธรรม กุศล อกุศล อพยากตะ ปะปนกัน. ว่าโดยประเภท (นับตามชื่อที่แจกแจง) มี ๖๔ ประเภท = เหตุ ๖ + ฌานังคะ ๗ + มัคคังคะ ๑๒ + อินทรีย์ ๒๒ + พละ ๙ + อธิบดี ๔ + อาหาร ๔ (L489-L491). ว่าโดยองค์ธรรมปรมัตถ์ (คาถา L656-L666) มี ๖ + ๕ + ๙ + ๑๖ + ๙ + ๔ + ๔. count_label ของแต่ละ set = จำนวนตามชื่อที่แจกแจง; expect = จำนวนสมาชิกที่ลงไว้ = จำนวนตามชื่อ; การยุบเป็นองค์ธรรมปรมัตถ์อธิบายไว้ใน note ของ set (jhananga 7→5, magganga 12→9, indriya 22→16). stub data/p7.yaml (hetu ๖, jhananga ๗, magganga ๑๒, indriya ๒๒, bala ๙, adhipati ๔, ahara ๔) ตรงกับ reference ทุก set — ไม่มี discrepancy.
