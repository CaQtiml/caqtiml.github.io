    ๖ และอารมณ์ ๖ (L1475). เนื้อความ ๕ อย่างของศัพท์อายตนะ (สัญชาติเทสัฏฐ นิวาสัฏฐ อากรัฏฐ สโมสรณัฏฐ การณัฏฐ,
