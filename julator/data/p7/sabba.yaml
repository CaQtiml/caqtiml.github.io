  note: ธาตุ ๑๘ = อายตนะ ๑๒ ขยายออก โดยแยกมนายตนะเป็นวิญญาณธาตุ ๗ (จักขุ- โสต- ฆาน- ชิวหา- กายวิญญาณธาตุ
    + มโนธาตุ + มโนวิญญาณธาตุ). ต่างกัน ๑๘ โดยปริยายแห่งทวาร ๖ อารมณ์ ๖ และวิญญาณ ๖ (L1475). ธาตุ = นิสฺสตฺต
    นิชฺชีว, ทรงไว้ซึ่งสภาพของตน (L1633-L1651).
