- id: sacca
  thai: อริยสัจจะ
  count_label: "๔"
  gatha: 'ทุกฺขํ เตภูมกํ วฏฺฏํ  ตณฺหา สมุทโย ภเว / นิโรโธ นาม นิพฺพานํ  มคฺโค โลกุตฺตโร มโต ฯ  // สัจจวิมุตต์:
    มคฺคยุตฺตา ผลา เจว  จตุสจฺจวินิสฺสฏา / อิติ ปญฺจปฺปเภเทน  ปวุตฺโต สพฺพสงฺคโห ฯ'
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L1437-L1447, คาถา L1477-L1490, คำอธิบาย L1653-L1698
  note: ทุกข์ = ผล, สมุทัย = เหตุ; นิโรธ = ผล, มรรค = เหตุ. ทุกข์+สมุทัย เป็นโลกียสัจจะ; นิโรธ+มรรค เป็นโลกุตตรสัจจะ
    (การจำแนกโดยเหตุ-ผล / โลกียะ-โลกุตตระ / วัฏฏะ, L1675-L1698 — อธิบายไว้ ไม่ทำเป็นโครงสร้าง). ธรรมที่เป็นสัจจวิมุตต์
    = มัคคจิตตุปบาท ๒๕ (เว้นองค์มรรค ๘) ที่ประกอบกับมัคคจิต + ผลจิตตุปบาท ๓๓ (โลกุตตรธรรมนอกจากองค์มรรค
    ๘ และนิพพาน) พ้นจากสัจจะทั้ง ๔ (L1484-L1489).
