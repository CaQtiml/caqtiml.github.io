- id: khandha
  thai: ขันธ์
  count_label: "๕"
  gatha: รูปญฺจ เวทนา สญฺญา  เสสเจตสิกา ตถา / วิญฺญาณมิติ ปญฺเจเต  ปญฺจกฺขนฺธา ภาสิตา ฯ
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L1341-L1353, คาถา L1449-L1462
  note: ขันธ์ = กอง/กลุ่มธรรมที่มีประเภทต่างกัน ๕ (อดีต-ปัจจุบัน-อนาคต / อัชฌัตตะ-พหิทธะ / โอฬาริกะ-สุขุมะ
    / หีนะ-ปณีตะ / ทูระ-สันติกะ) จึงเวทนาเจตสิกดวงเดียวก็เป็นเวทนาขันธ์ได้ (L1505-L1525). นิพพานเป็นขันธวิมุตต์
    เพราะไม่มีประเภทต่างกันเหล่านั้น มีแต่กาลวิมุตต์ พหิทธะ สุขุมะ ปณีตะ ทูระ อย่างเดียว (L1527-L1539).
