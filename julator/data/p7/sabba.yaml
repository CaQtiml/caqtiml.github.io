- id: ayatana
  thai: อายตนะ
  count_label: "๑๒"
  gatha: ทฺวารา ลมฺพนเภเทน  ภวนฺตายตนานิ จ / ทฺวารา ลมฺพต ทุปฺปนฺน-  ปริยาเยน ธาตุโย ฯ
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L1369-L1395, คาถา L1470-L1476, คำอธิบาย L1577-L1613
