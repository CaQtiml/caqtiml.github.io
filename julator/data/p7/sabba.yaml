- id: upadanakkhandha
  thai: อุปาทานักขันธ์
  count_label: "๕"
  gatha: ปญฺจุปาทานกฺขนฺธาติ  ตถา เตภูมกา มตา / เภทาภาเวน นิพฺพานํ  ขนฺธสงฺคหนิสฺสฏํ ฯ
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L1355-L1367, คาถา L1449-L1462, คำอธิบาย L1567-L1575
  note: ขันธ์ที่เป็นอารมณ์ของอุปาทาน = ขันธ์ ๕ เฉพาะส่วนที่เป็นโลกียะ (เตภูมก). เวทนา สัญญา สังขาร วิญญาณ
    ที่เป็นโลกุตตระ ไม่เป็นอารมณ์ของอุปาทาน ๔ (กาม ทิฏฐิ สีลัพพต อัตตวาท) จึงทรงแยกแสดงต่างหาก (L1575).
    นิพพาน/โลกุตตรธรรม เป็นขันธวิมุตต์อยู่แล้ว ไม่เข้าในหมวดนี้.
