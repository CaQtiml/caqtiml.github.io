- id: indriya
  thai: อินทรีย์
  count_label: "๒๒"
  gatha: อินฺทนฺติ ปรมอิสฺสริยํ กโรนฺตีติ = อินฺทฺริยานิ
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L555-L601 (แจกแจง); คำอธิบาย L753-L773
  note: 'แจกแจง ๒๒ อินทรีย์ แต่องค์ธรรมปรมัตถ์มี ๑๖ (คาถา L664-L666: ''โสฬสินฺทฺริยธมฺมา'') — เวทนา ๕
    อินทรีย์ = เวทนาเจตสิกดวงเดียว; มนินทรีย์ = จิต (๑ ปรมัตถ์ประเภท); ปัญญินทรีย์+อนัญญาตัญญัสสามิตินทรีย์+อัญญินทรีย์+อัญญาตาวินทรีย์
    = ปัญญาเจตสิก; ชีวิตินทรีย์ = ๒ ปรมัตถ์ (ชีวิตรูป + ชีวิตินทรียเจตสิก). ๕+๒+๒+๑+๑+สัทธา+วิริยะ+สติ+เอกัคคตา
    = ๑๖. ลงสมาชิกครบ ๒๒ (expect 22). จำแนกโดยภูมิ (L765-L774, ไม่ทำเป็นโครงสร้าง): กามอินทรีย์ ๑๐ (จักขุ..กาย+อิตถี+ปุริส+สุข+ทุกข์+โทมนัส);
    กาม-รูป-อรูป-โลกุตตรอินทรีย์ ๘ (ชีวิต มน อุเบกขา สัทธา วิริยะ สติ สมาธิ ปัญญา); กาม-รูป-โลกุตตรอินทรีย์
    ๑ (โสมนัสสินทรีย์); โลกุตตรอินทรีย์ ๓ (อนัญญาตฯ อัญญินทรีย์ อัญญาตาวินทรีย์). คาถา L649-L655: เอกัคคตาเจตสิกที่ใน
    อวีริยจิต ๑๖ ย่อมไม่ถึงสมาธินทรีย์.'
  expect: 22
