    note: เวทนาเจตสิก (อุเบกขาเวทนา) ที่ใน อุเบกขาสหคตจิต ๔๗ (เว้นทวิปัญจวิญญาณอุเบกขา ๘)
- id: magganga
  thai: มัคคังคะ
  count_label: "๑๒"
  gatha: สุคติยา จ ทุคฺคติยา จ นิพฺพานสฺส จ ปาปณา / เตสญฺจ ปฏิปตฺตตา มคฺคงฺคานีติ วุจฺจเร ฯ / มคฺคสฺส
    วา องฺคานีติ มคฺคงฺคานิ สมฺมตา
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L527-L553 (แจกแจง); คำอธิบาย L718-L751
  note: 'แจกแจง ๑๒ องค์ (สัมมา ๘ + มิจฉา ๔) แต่องค์ธรรมปรมัตถ์มี ๙ (คาถา L664: ''มคฺคงฺคา นว วตฺถุโต'')
    เพราะ สัมมาสังกัปปะ/มิจฉาสังกัปปะ = วิตก, สัมมาวายามะ/มิจฉาวายามะ = วิริยะ, สัมมาสมาธิ/มิจฉาสมาธิ
    = เอกัคคตา (แต่ละคู่เป็นเจตสิกดวงเดียว). ลงสมาชิกครบ ๑๒ (expect 12). องค์มรรคฝ่ายสุคติ+นิพพาน ๘, ฝ่ายทุคติ
    ๔ (L733-L749). พระสูตรแสดงหนทางนอกจากองค์มรรค ๑๒ อีก ๔ คือ มิจฉาวาจา มิจฉากัมมันตะ มิจฉาอาชีวะ มิจฉาสติ
    แต่ไม่มีองค์ธรรมปรมัตถ์โดยเฉพาะ (= อกุศลจิตตุปบาทที่เกี่ยวด้วยทุจริต) — ไม่ลงเป็นสมาชิก (L751). คาถา
    L649-L655: อเหตุกจิต ๑๘ ย่อมไม่ได้องค์มรรค; เอกัคคตาในวิจิกิจฉาสัมปยุตตจิต ไม่ถึงมิจฉาสมาธิ.'
  expect: 12
