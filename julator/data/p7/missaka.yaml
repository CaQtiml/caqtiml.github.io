- id: jhananga
  thai: ฌานังคะ
  count_label: "๗"
  gatha: อารมฺมณุปนิชฺเฌนฺติ อิติ ฌานานิ วุจฺจเร / ฌาเปนฺติ วา ปจฺจนีเก อิติปิ ฌานสญฺญิตา ฯ
  source: reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L509-L525 (แจกแจง); คำอธิบาย L689-L716
  note: 'แจกแจง ๗ องค์ แต่องค์ธรรมปรมัตถ์มี ๕ (คาถา L664: ''ปญฺจ ฌานงฺคา'') เพราะ โสมนัส โทมนัส อุเบกขา
    ทั้ง ๓ มีองค์ธรรมเป็นเวทนาเจตสิกดวงเดียวกัน — จึงลงสมาชิกครบ ๗ (expect 7) และ ongkhatham ซ้ำที่ vedana.
    ธรรมปฏิปักษ์ต่อองค์ฌาน (L704-L716): ถีนมิทธะ-วิตก, วิจิกิจฉา-วิจาร, พยาบาท-ปีติ, กามฉันทะ-เอกัคคตา,
    อุทธัจจะ/กุกกุจจะ/โทมนัส-โสมนัส+อุเบกขา, ปีติ+โสมนัส-โทมนัส. คาถา L649-L655: ทวิปัญจวิญญาณจิต ๑๐ ย่อมไม่ได้องค์ฌาน
    (เทียบ host ของเอกัคคตา ''จิต ๑๑๑ เว้นทวิปัญจวิญญาณ ๑๐'').'
  expect: 7
