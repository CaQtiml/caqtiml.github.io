      - id: samadhibala
        thai: สมาธิพละ
        ongkhatham: [ekaggata]
        note: "เอกัคคตาเจตสิก -- ไม่หวั่นไหวในการตั้งมั่น (ข้าศึก = อุทธัจจะ)"
