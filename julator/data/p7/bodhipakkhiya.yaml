id: bodhipakkhiya
thai: โพธิปักขิยสังคหะ
count_label: "๓๗"
gatha: >-
  ฉนฺโท จิตฺตมุเปกฺขา จ สทฺธาปสฺสทฺธิปีติโย /
  สมฺมาทิฏฺฐิ จ สงฺกปฺโป วายาโม วิรติตฺตยํ /
  สมฺมาสติ สมาธีติ จุทฺทเสเต สภาวโต /
  สตุตฺตึสปฺปเภเทน สตฺตธา ตตฺถ สงฺคโห ฯ
source: "reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L881-L1327"
note: >-
  โพธิปักขิยธรรม = ธรรมฝ่ายมรรคญาณ ๔ (L1067-L1085). มี ๗ หมวด รวม ๓๗ ประการ
  แต่เมื่อว่าโดยองค์ธรรมปรมัตถ์มีเพียง ๑๔ (คาถา L1001-L1011): ฉันทะ, จิต,
  ตัตรมัชฌัตตตา, สัทธา, ปัสสัทธิ (กายปัสสัทธิ+จิตตปัสสัทธิ นับเป็น ๑), ปีติ,
  ปัญญา, วิตก, วีริยะ, วิรตีเจตสิก ๓ (สัมมาวาจา สัมมากัมมันตะ สัมมาอาชีวะ),
  สติ, เอกัคคตา.
  การจำแนก ๑๔ องค์ธรรมโดยฐาน (คาถา + คำอธิบาย L1013-L1058):
  ๙ องค์ธรรมมีฐานละ ๑ = วิตก(สัมมาสังกัปปะ), ปัสสัทธิ(ปัสสัทธิสัมโพชฌงค์),
  ปีติ(ปีติสัมโพชฌงค์), ตัตรมัชฌัตตตา(อุเบกขาสัมโพชฌงค์), ฉันทะ(ฉันทิทธิบาท),
  จิต(จิตติทธิบาท), สัมมาวาจา, สัมมากัมมันตะ, สัมมาอาชีวะ;
  วีริยะมี ๙ ฐาน (สัมมัปปธาน ๔ + วิริยิทธิบาท + วิริยินทรีย์ + วิริยพละ +
  วิริยสัมโพชฌงค์ + สัมมาวายามะ);
  สติมี ๘ ฐาน (สติปัฏฐาน ๔ + สตินทรีย์ + สติพละ + สติสัมโพชฌงค์ + สัมมาสติ);
  เอกัคคตามี ๔ ฐาน (สมาธินทรีย์ + สมาธิพละ + สมาธิสัมโพชฌงค์ + สัมมาสมาธิ);
  ปัญญามี ๕ ฐาน (วีมังสิทธิบาท + ปัญญินทรีย์ + ปัญญาพละ + ธัมมวิจยสัมโพชฌงค์ +
  สัมมาทิฏฐิ);
  สัทธามี ๒ ฐาน (สัทธินทรีย์ + สัทธาพละ). รวม ๙+๙+๘+๔+๕+๒ = ๓๗.
  ที่เกิดของโพธิปักขิยธรรม ๓๗ (คาถา L1060-L1066): ทั้ง ๓๗ เกิดในโลกุตตรจิต
  (เว้น สัมมาสังกัปปะ ไม่เกิดในโลกุตตรทุติยฌานขึ้นไป, ปีติสัมโพชฌงค์ ไม่เกิดใน
  โลกุตตรจตุตถฌาน/ปัญจมฌาน) และเกิดในโลกียกุศล/กิริยาได้เมื่อสำเร็จวิสุทธิ ๖
  (เว้นญาณทัสสนวิสุทธิ). -- deferred, not built as structure.
  การจำแนกองค์มรรค ๘ โดยขันธ์ (L1319-L1326): สีลขันธ์ = สัมมาวาจา/สัมมากัมมันตะ/
  สัมมาอาชีวะ; สมาธิขันธ์ = สัมมาวายามะ/สัมมาสติ/สัมมาสมาธิ; ปัญญาขันธ์ =
  สัมมาทิฏฐิ/สัมมาสังกัปปะ. -- deferred, not built as structure.

sets:
  - id: satipatthana
    thai: สติปัฏฐาน
    count_label: "๔"
    source: "reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L891-L901, L1087-L1129"
    note: >-
      องค์ธรรมของทั้ง ๔ คือ สติเจตสิก ดวงเดียว -- สติดวงเดียวเป็นสติปัฏฐานทั้ง ๔
      ได้เพราะอารมณ์ที่ตั้งมี ๔, ลักขณะที่ปรากฏมี ๔, การประหาณวิปลาสมี ๔
      (L1099-L1108). ต่างกันเฉพาะอารมณ์ ตามที่ระบุใน note ของแต่ละสมาชิก.
      host จิต = มหากุศล ๘ + มหากิริยา ๘ + อัปปนาชวนะ ๒๖.
    expect: 4
    members:
      - id: kayanupassana
        thai: กายานุปัสสนาสติปัฏฐาน
        ongkhatham: [sati]
        note: "สติเจตสิก มีรูปขันธ์ (กาย -- ลมหายใจเข้าออก อิริยาบถใหญ่/น้อย) เป็นอารมณ์; ปรากฏอสุภลักขณะ ประหาณสุภวิปลาส"
      - id: vedananupassana
        thai: เวทนานุปัสสนาสติปัฏฐาน
        ongkhatham: [sati]
        note: "สติเจตสิก มีเวทนาขันธ์ (สุข ทุกข์ เฉยๆ) เป็นอารมณ์; ปรากฏทุกขลักขณะ ประหาณสุขวิปลาส"
      - id: cittanupassana
        thai: จิตตานุปัสสนาสติปัฏฐาน
        ongkhatham: [sati]
        note: "สติเจตสิก มีวิญญาณขันธ์ (จิต) เป็นอารมณ์; ปรากฏอนิจจลักขณะ ประหาณนิจจวิปลาส"
      - id: dhammanupassana
        thai: ธัมมานุปัสสนาสติปัฏฐาน
        ongkhatham: [sati]
        note: "สติเจตสิก มีสัญญาขันธ์และสังขารขันธ์ (สภาวธรรม) เป็นอารมณ์; ปรากฏอนัตตลักขณะ ประหาณอัตตวิปลาส"

  - id: sammappadhana
    thai: สัมมัปปธาน
    count_label: "๔"
    source: "reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L903-L921, L1131-L1194"
    note: >-
      องค์ธรรมของทั้ง ๔ คือ วีริยเจตสิก ดวงเดียว -- วิริยะดวงเดียวเป็นสัมมัปปธาน
      ทั้ง ๔ ได้เพราะกิจของวิริยะมี ๔ อย่าง (L1141-L1148). ต้องเป็นวิริยะอย่าง
      แรงกล้าในกุศลชวนะเท่านั้น (วิริยะในกิริยาชวนะ/ผลจิต ไม่เป็นสัมมัปปธาน --
      L1137-L1139); host จิต = กุศลจิต ๒๑.
    expect: 4
    members:
      - id: pahana
        thai: "อุปฺปนฺนานํ ปาปกานํ ปหานาย วายาโม"
        ongkhatham: [viriya]
        note: "วีริยเจตสิก -- ความพยายามเพื่อละอกุศลที่เกิดขึ้นแล้ว; ที่ใน กุศลจิต ๒๑"
      - id: anuppada
        thai: "อนุปฺปนฺนานํ ปาปกานํ อนุปฺปาทาย วายาโม"
        ongkhatham: [viriya]
        note: "วีริยเจตสิก -- ความพยายามเพื่อไม่ให้อกุศลที่ยังไม่เกิดเกิดขึ้น; ที่ใน กุศลจิต ๒๑"
      - id: uppada
        thai: "อนุปฺปนฺนานํ กุสลานํ อุปฺปาทาย วายาโม"
        ongkhatham: [viriya]
        note: "วีริยเจตสิก -- ความพยายามเพื่อให้กุศลที่ยังไม่เกิดเกิดขึ้น; ที่ใน กุศลจิต ๒๑"
      - id: bhiyyobhava
        thai: "อุปฺปนฺนานํ กุสลานํ ภิยฺโยภาวาย วายาโม"
        ongkhatham: [viriya]
        note: "วีริยเจตสิก -- ความพยายามเพื่อให้กุศลที่เกิดแล้วเจริญยิ่งๆ ขึ้น; ที่ใน กุศลจิต ๒๑"

  - id: iddhipada
