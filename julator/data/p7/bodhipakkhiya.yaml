      อินทรีย์ ๕ ฝ่ายโพธิปักขิยะ (ต่างจาก อินทรีย์ ๒๒ ในมิสสกสังคหะ). องค์ธรรม =
      ๕ เจตสิก: สัทธา วีริยะ สติ เอกัคคตา ปัญญา. วจนัตถะดูในมิสสกสังคหะ (L1216).
