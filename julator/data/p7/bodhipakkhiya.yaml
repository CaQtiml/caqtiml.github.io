        thai: ปัญญาพละ
        ongkhatham: [panna]
        note: "ปัญญาเจตสิก -- ไม่หวั่นไหวในการรู้ตามจริง (ข้าศึก = โมหะ); ที่ใน มหากุศล/มหากิริยาญาณสัมปยุตต ๘ + อัปปนาชวนะ ๒๖"

  - id: bojjhanga
    thai: โพชฌงค์
    count_label: "๗"
    source: "reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L963-L979, L1218-L1258"
    note: >-
      โพชฌงค์ ๗ = องค์แห่งการรู้อริยสัจจ์ ๔. องค์ธรรม ๗ หมวด แต่มี ๘ เจตสิก
      เพราะปัสสัทธิสัมโพชฌงค์ = กายปัสสัทธิ + จิตตปัสสัทธิ (ทั้ง ๒ รวมนับเป็น ๑
      องค์ธรรม -- L975, L1011, L1250). อุเบกขาสัมโพชฌงค์ = ตัตรมัชฌัตตตาเจตสิก
      (ไม่ใช่ อุเบกขาเวทนา -- L979, L1256). host จิต = มหากุศล ๘ + มหากิริยา ๘ +
      อัปปนาชวนะ ๒๖ (ธัมมวิจยะ = ญาณสัมปยุตตเท่านั้น; ปีติ = เฉพาะจิตที่มีปีติ).
    expect: 7
    members:
      - id: sati_sambojjhanga
        thai: สติสัมโพชฌงค์
        ongkhatham: [sati]
        note: "สติเจตสิก -- ระลึกติดต่อในอารมณ์สติปัฏฐาน ๔ ทำลายความประมาท"
      - id: dhammavicaya_sambojjhanga
        thai: ธัมมวิจยสัมโพชฌงค์
        ongkhatham: [panna]
        note: "ปัญญาเจตสิก -- ค้นคว้าในธรรม รู้ความเกิดดับของรูปนาม ทำลายโมหะ; ที่ใน มหากุศล/มหากิริยาญาณสัมปยุตต ๘ + อัปปนาชวนะ ๒๖"
      - id: viriya_sambojjhanga
        thai: วิริยสัมโพชฌงค์
        ongkhatham: [viriya]
        note: "วีริยเจตสิก -- ความเพียรแรงกล้าในกิจ ๔ ทำลายโกสัชชะ"
      - id: piti_sambojjhanga
        thai: ปีติสัมโพชฌงค์
        ongkhatham: [piti]
        note: "ปีติเจตสิก -- ความชุ่มชื่นใจในอารมณ์วิปัสสนา ทำลายอรติ; ที่ใน มหากุศลโสมนัส ๔ + มหากิริยาโสมนัส ๔ + สัปปีติกอัปปนาชวนะ ๓๐"
      - id: passaddhi_sambojjhanga
        thai: ปัสสัทธิสัมโพชฌงค์
        ongkhatham: [kayapassaddhi, cittapassaddhi]
        note: "กายปัสสัทธิเจตสิก + จิตตปัสสัทธิเจตสิก (ทั้ง ๒ รวมนับเป็น ๑ องค์ธรรม) -- ความสงบกายสงบใจ ทำลายความกระด้าง/เดือดร้อน"
      - id: samadhi_sambojjhanga
        thai: สมาธิสัมโพชฌงค์
        ongkhatham: [ekaggata]
        note: "เอกัคคตาเจตสิก -- ตั้งมั่นในอารมณ์วิปัสสนา ทำลายความฟุ้งซ่าน"
      - id: upekkha_sambojjhanga
        thai: อุเบกขาสัมโพชฌงค์
        ongkhatham: [tatramajjhattata]
        note: "ตัตรมัชฌัตตตาเจตสิก -- ทำให้สัทธา/ปัญญา วีริยะ/สมาธิ สม่ำเสมอ ไม่หย่อนไม่ยิ่ง (มิใช่อุเบกขาเวทนา)"

  - id: magganga
    thai: มัคคังคะ
    count_label: "๘"
    source: "reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L981-L999, L1260-L1326"
    note: >-
      มัคคังคะ ๘ ฝ่ายโพธิปักขิยะ (ต่างจาก มัคคังคะ ๑๒ ในมิสสกสังคหะ). องค์ธรรม =
      ๘ เจตสิก: ปัญญา วิตก สัมมาวาจา สัมมากัมมันตะ สัมมาอาชีวะ วีริยะ สติ
      เอกัคคตา. วิรตี ๓ (วาจา/กัมมันตะ/อาชีวะ) host = มหากุศล ๘ + โลกุตตร ๘
      (ไม่มีในมหากิริยา); ที่เหลือ host = มหากุศล ๘ + มหากิริยา ๘ + อัปปนาชวนะ ๒๖.
      จำแนกโดยขันธ์ (L1319-L1326): สีลขันธ์ = วาจา/กัมมันตะ/อาชีวะ; สมาธิขันธ์ =
      วายามะ/สติ/สมาธิ; ปัญญาขันธ์ = ทิฏฐิ/สังกัปปะ.
    expect: 8
    members:
      - id: samma_ditthi
        thai: สัมมาทิฏฐิ
        ongkhatham: [panna]
        note: "ปัญญาเจตสิก -- เห็นแจ้งอริยสัจจ์ ๔ โดยกิจ ๔ (ปริญญา ปหาน สัจฉิกรณ ภาวนา); ที่ใน ญาณสัมปยุตต ๘ + อัปปนาชวนะ ๒๖"
      - id: samma_sankappa
        thai: สัมมาสังกัปปะ
        ongkhatham: [vitakka]
        note: "วิตกเจตสิก -- ดำริออกจากกาม/ไม่พยาบาท/ไม่เบียดเบียน; ที่ใน มหากุศล ๘ + มหากิริยา ๘ + ปฐมฌานชวนะ ๑๐ (ไม่เกิดในทุติยฌานขึ้นไป)"
      - id: samma_vaca
        thai: สัมมาวาจา
        ongkhatham: [samma_vaca]
        note: "สัมมาวาจาเจตสิก -- เว้นวจีทุจริต ๔ ที่ไม่เกี่ยวกับอาชีพ; ที่ใน มหากุศล ๘ + โลกุตตร ๘"
      - id: samma_kammanta
        thai: สัมมากัมมันตะ
        ongkhatham: [samma_kammanta]
        note: "สัมมากัมมันตเจตสิก -- เว้นกายทุจริต ๓ ที่ไม่เกี่ยวกับอาชีพ; ที่ใน มหากุศล ๘ + โลกุตตร ๘"
      - id: samma_ajiva
        thai: สัมมาอาชีวะ
        ongkhatham: [samma_ajiva]
        note: "สัมมาอาชีวเจตสิก -- เว้นวจีทุจริต ๔ กายทุจริต ๓ ที่เกี่ยวกับอาชีพ; ที่ใน มหากุศล ๘ + โลกุตตร ๘"
      - id: samma_vayama
        thai: สัมมาวายามะ
        ongkhatham: [viriya]
        note: "วีริยเจตสิก -- ความเพียรตามสัมมัปปธาน ๔; ที่ใน มหากุศล ๘ + มหากิริยา ๘ + อัปปนาชวนะ ๒๖"
      - id: samma_sati
        thai: สัมมาสติ
        ongkhatham: [sati]
        note: "สติเจตสิก -- ความระลึกตามสติปัฏฐาน ๔; ที่ใน มหากุศล ๘ + มหากิริยา ๘ + อัปปนาชวนะ ๒๖"
      - id: samma_samadhi
        thai: สัมมาสมาธิ
        ongkhatham: [ekaggata]
        note: "เอกัคคตาเจตสิก -- ความตั้งมั่นในอารมณ์วิปัสสนากรรมฐาน; ที่ใน มหากุศล ๘ + มหากิริยา ๘ + อัปปนาชวนะ ๒๖"
