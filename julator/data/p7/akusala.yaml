id: akusala
thai: อกุศลสังคหะ
source: "reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L77-L479"
gatha: |
  อาสโวฆา จ โยคา จ ตโย คันถา จ วัตถุโต
  อุปาทานา ทุเว วุตตา อัฏฐ นีวรณา สิยุ ฯ
  ฉเทวานุสยา โหนติ นว สัญโญชนา มตา
  กิเลสา ทส วุตโตยํ นวธา ปาปสังคโห ฯ
gatha_source: "reference/02-ปริจเฉทที่7-สมุจจยสังคหะ.md L249-L262"
note: >-
  อกุศลสังคหะมี ๙ หมวด (อาสวะ โอฆะ โยคะ คันถะ อุปาทาน นีวรณะ อนุสัย สังโยชน์ กิเลส).
  คาถาแสดงองค์ธรรม (L249-L262) ให้จำนวน "องค์ธรรมปรมัตถ์" คือ จำนวนเจตสิกที่ต่างกัน
  ของแต่ละหมวด: อาสวะ/โอฆะ/โยคะ/คันถะ หมวดละ ๓, อุปาทาน ๒, นีวรณะ ๘, อนุสัย ๖,
  สังโยชน์ ๙, กิเลส ๑๐. ตัวเลขนี้ไม่ใช่จำนวนสมาชิกที่มีชื่อในแต่ละหมวด; count_label
  และ expect ของแต่ละ set = จำนวนสมาชิกที่มีชื่อที่ตำราแจกแจง (L85-L247).
